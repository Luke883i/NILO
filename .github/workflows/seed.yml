name: NILO PR1 seed - source assurance only
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact source revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --version
      - name: Verify physical LV02 game route, independent CP02 and five source mutants
        run: node --test tests/lv-02.test.mjs tests/lv-02-mutation.test.mjs
      - name: Verify Custode encounter contract and eight original-source physical mutants
        run: node --test tests/custode.test.mjs tests/custode-mutation.test.mjs
      - name: Verify narrative, requirements, DoD, BOM and source boundaries
        run: node scripts/verify.mjs
      - name: Test deterministic playable physics and checkpoint
        run: node --test tests/core.test.mjs
      - name: Prove bounded input timing, jump height, reset and original six-jump route
        run: node --test tests/feel.test.mjs
      - name: Test contract, reticular DoD and S-BOM negative cases
        run: node --test tests/contracts.test.mjs tests/experience.test.mjs
      - name: Validate product software repository map
        run: node scripts/verify-development.mjs
      - name: Falsify bridge declarations and missing owners
        run: node --test tests/development.test.mjs
      - name: Kill checkpoint-forgery source mutant
        env:
          NILO_MUTANT: forged-checkpoint
        run: node --test tests/mutation.test.mjs
      - name: Kill broken-pause source mutant
        env:
          NILO_MUTANT: broken-pause
        run: node --test tests/mutation.test.mjs
      - name: Kill platform-tunneling source mutant
        env:
          NILO_MUTANT: platform-tunneling
        run: node --test tests/mutation.test.mjs
      - name: Kill coyote-grace removal in original source
        env:
          NILO_MUTANT: coyote-disabled
        run: node --test tests/mutation.test.mjs
      - name: Kill jump buffer removal in original source
        env:
          NILO_MUTANT: buffer-disabled
        run: node --test tests/mutation.test.mjs
      - name: Kill short/long jump height equivalence in original source
        env:
          NILO_MUTANT: jump-height-disabled
        run: node --test tests/mutation.test.mjs
      - name: Kill held-key automatic jump re-trigger
        env:
          NILO_MUTANT: hold-autorepeat
        run: node --test tests/mutation.test.mjs
      - name: Kill held-key respawn spurious jump
        env:
          NILO_MUTANT: respawn-held-edge
        run: node --test tests/mutation.test.mjs
      - name: Kill held-key restart spurious jump
        env:
          NILO_MUTANT: restart-held-edge
        run: node --test tests/mutation.test.mjs
      - name: Kill paused-key spurious jump
        env:
          NILO_MUTANT: resume-held-edge
        run: node --test tests/mutation.test.mjs
      - name: Kill incorrect buffered short-hop apex
        env:
          NILO_MUTANT: buffered-hop-released
        run: node --test tests/mutation.test.mjs
      - name: Kill missing sub-tick press event
        env:
          NILO_MUTANT: subtick-edge-dropped
        run: node --test tests/mutation.test.mjs
      - name: Verify pixel-art source, real contrast mutant and semantic-oracle tests
        run: node --test tests/art.test.mjs tests/art-mutation.test.mjs tests/semantic-campaign.test.mjs
      - name: Exhaust pre-seeded 10M semantic design vectors (not game executions)
        run: node scripts/semantic-campaign.mjs --count 10000000 --seed 20261109 --out /tmp/nilo-semantic-10m.json
      - name: Exhaust 10M browser-aware adversarial semantic design mutants (not browser runs)
        run: node scripts/semantic-campaign.mjs --browser-adversarial --count 10000000 --seed 20261109 --out /tmp/nilo-browser-semantic-10m.json
      - name: Falsify 1M preseeded I02 game-feel semantic vectors (not physical playthroughs)
        run: node scripts/semantic-campaign.mjs --feel-adversarial --count 1000000 --seed 20261109 --out /tmp/nilo-feel-semantic-1m.json
      - name: Capture process-reported source hashes and SHA without self-approval
        run: |
          node scripts/evidence.mjs --out /tmp/nilo-seed-evidence.json
          node -e 'const a=require("/tmp/nilo-seed-evidence.json"); if(a.contracts.source_status!=="PASS_SCOPED_SOURCE" || a.source_commit_sha!==require("child_process").execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim() || a.release_authorized || a.browser!=="NOT_RUN_BY_THIS_COMMAND") process.exit(2);'
      - name: Upload source-only evidence for independent examination
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nilo-source-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nilo-seed-evidence.json
            /tmp/nilo-semantic-10m.json
            /tmp/nilo-browser-semantic-10m.json
            /tmp/nilo-feel-semantic-1m.json
          if-no-files-found: warn
          retention-days: 14

  browser-lv01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind browser witness to exact source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python --version
      - name: Install pinned test-only Playwright
        run: python -m pip install playwright==1.57.0
      - name: Verify GitHub-hosted Chrome browser is available
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Smoke - real HTTP origin, modules and pixel rendering
        run: python tests/browser-e2e.py --stage smoke --out /tmp/nilo-browser-smoke
      - name: Input lifecycle - native events, real respawn, pause and physical queue mutant
        run: python tests/browser-e2e.py --stage input-continuity --out /tmp/nilo-input-continuity --physical-mutant
      - name: Full LV01 real-origin E2E including all prior negative oracles
        run: python tests/browser-e2e.py --stage complete --out /tmp/nilo-browser-evidence --physical-mutant
      - name: Execute real-origin LV01 to LV02 route, CP02 reload and canal source mutants
        run: python tests/browser-lv-02.py --out /tmp/nilo-browser-lv02 --physical-mutant
      - name: Independently verify LV02 source-bound receipt and four PNG digests
        run: |
          python - <<'PY_LV02'
          import hashlib,json,subprocess
          from pathlib import Path
          folder=Path('/tmp/nilo-browser-lv02')
          r=json.loads((folder/'lv02-browser-receipt.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['source_sha']==sha and r['browser_executed']
          assert r['status']=='PASS_SCOPED_TWO_LEVEL_GATE_NOT_BOSS_VICTORY'
          assert not r['beta_authorized'] and not r['independent_player_acceptance']
          assert not r['six_levels_complete'] and r['custode_implemented'] and not r['boss_victory_observed']
          assert len(r['screenshots'])==4 and r['pixel_grid']['mismatches']==0
          assert r['checks']['lv02_playthrough']=='PASS_OBSERVED'
          assert r['checks']['forged_cp02_rejected']=='PASS_OBSERVED'
          assert r['checks']['mutant_frozen-bridge']=='KILLED_BY_BROWSER_ORACLE'
          assert r['checks']['mutant_disabled-current']=='KILLED_BY_BROWSER_ORACLE'
          for z in r['screenshots']:
              filename=z['name'];assert Path(filename).name==filename
              data=(folder/filename).read_bytes()
              assert data.startswith(bytes.fromhex('89504e470d0a1a0a'))
              assert len(data)==z['bytes'] and len(data)>1000
              assert hashlib.sha256(data).hexdigest()==z['sha256']
              assert hashlib.sha256(data+b'X').hexdigest()!=z['sha256']
          print('PASS_SCOPED_TWO_LEVEL_BROWSER_NO_BOSS',sha)
          PY_LV02
      - name: Real HTTP Custode attack, repair, defeat/retry and physical no-repair mutant
        run: python tests/browser-custode.py --out /tmp/nilo-browser-custode --physical-mutant
      - name: Verify first-boss source-bound receipt and original screenshot byte digests
        run: |
          python - <<'PY_BOSS'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('/tmp/nilo-browser-custode/custode-receipt.json')
          r=json.loads(p.read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['source_sha']==sha and r['browser_executed']
          assert r['status']=='PASS_SCOPED_CUSTODE_BROWSER_NO_USER_APPROVAL'
          assert not r['beta_authorized'] and not r['independent_player_acceptance']
          assert not r['six_levels_complete']
          assert [x['count'] for x in r['repairs']]==[1,2]
          assert r['checks']['gate_not_victory']=='PASS_OBSERVED'
          assert r['checks']['victory_requires_two_real_e_presses']=='PASS_OBSERVED'
          assert r['checks']['checkpoint_not_victory']=='PASS_OBSERVED'
          assert r['checks']['defeat_and_cp02_retry']=='PASS_OBSERVED'
          assert r['checks']['no_repair_source_mutant']=='KILLED_BY_BROWSER_ORACLE'
          assert len(r['screenshots'])==3
          for z in r['screenshots']:
              raw=(p.parent/z['name']).read_bytes()
              assert raw.startswith(bytes.fromhex('89504e470d0a1a0a'))
              assert len(raw)==z['bytes'] and len(raw)>1000
              assert hashlib.sha256(raw).hexdigest()==z['sha256']
          print('PASS_SCOPED_CUSTODE_BROWSER_NO_USER_APPROVAL',sha)
          PY_BOSS
      - name: Verify receipt scope on exact HEAD (not beta approval)
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('/tmp/nilo-browser-evidence/browser-receipt.json')
          r=json.loads(p.read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['status']=='PASS_SCOPED_BROWSER_LV01'
          assert r['source_sha']==sha and r['browser_executed']
          assert not r['release_authorized'] and not r['independent_player_acceptance']
          assert len(r['screenshots'])==4
          assert len(r['checks'])>=13
          assert r['checks']['held_respawn_not_retriggered']=='PASS_OBSERVED'
          assert r['checks']['held_restart_not_retriggered']=='PASS_OBSERVED'
          assert r['checks']['paused_key_requires_new_edge']=='PASS_OBSERVED'
          assert r['checks']['subtick_keydown_keyup']=='PASS_OBSERVED'
          assert r['checks']['physical_subtick_queue_mutant']=='KILLED_BY_BROWSER_ORACLE'
          assert r['checks']['missing_module_not_playable']=='KILLED_BY_HTTP_404'
          assert r['checks']['real_checkpoint_write_mutant']=='KILLED_BY_BROWSER_ORACLE'
          assert r['subtick_witness']['ticks_before']==r['subtick_witness']['ticks_after']
          import hashlib
          folder=p.parent
          images={z['name'] for z in r['screenshots']}
          assert images=={'01-start.png','02-checkpoint.png','03-completed.png','04-mobile-unsupported.png'}
          for z in r['screenshots']:
              raw=(folder/z['name']).read_bytes()
              assert raw.startswith(bytes.fromhex('89504e470d0a1a0a'))
              assert len(raw)==z['bytes'] and len(raw)>1000
              assert hashlib.sha256(raw).hexdigest()==z['sha256']
              assert hashlib.sha256(raw+b'X').hexdigest()!=z['sha256']
          print('PASS_SCOPED_BROWSER_LV01 and PR7 input continuity on',sha)
          PY
      - name: Publish screenshots, logs, environment and digest receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nilo-browser-lv01-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nilo-browser-evidence/
            /tmp/nilo-browser-lv02/
            /tmp/nilo-browser-custode/
          if-no-files-found: warn
          retention-days: 14
